# PARC AUTO – PC de Hasna (mode multi-PC) : base MySQL commune + service Retour + interface Retours
#   docker compose -f compose.hasna.yaml up -d --build
# Ports à ouvrir dans le pare-feu de ce PC : 3306 (base), 8006 (API Retour), 5173 (interface Retours).
# Les adresses des autres PC viennent du fichier .env (IP_LEILA, IP_SARA…), voir docs/MULTI_PC.md.
name: parc-auto-hasna

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_location_voitures}
      MYSQL_USER: ${MYSQL_USER:-location_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      # Base UNIQUE de l'équipe : dump commun puis migrations de chaque service (ordre numérique)
      - ./Base_de_données/db_location_voitures.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./service_contrat/migrations/002_add_date_validation.sql:/docker-entrypoint-initdb.d/002_contract_date_validation.sql:ro
      - ./service_contrat/migrations/003_add_caution.sql:/docker-entrypoint-initdb.d/003_contract_caution.sql:ro
      - ./service_contrat/migrations/004_add_date_cloture.sql:/docker-entrypoint-initdb.d/004_contract_date_cloture.sql:ro
      - ./service_contrat/migrations/005_add_deposit_details.sql:/docker-entrypoint-initdb.d/005_contract_deposit.sql:ro
      - ./service_reservation/migrations/006_service_reservation.sql:/docker-entrypoint-initdb.d/006_service_reservation.sql:ro
      - ./database/migrations/007_vehicules_image_url.sql:/docker-entrypoint-initdb.d/007_vehicules_image_url.sql:ro
      - ./database/migrations/008_administrateur_services.sql:/docker-entrypoint-initdb.d/008_administrateur_services.sql:ro
    # Ouverte aux autres PC : tous les services de l'équipe utilisent cette base
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  service_retour:
    build:
      context: ./service_retour
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-location_app}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-db_location_voitures}
      CONTRAT_API_URL: http://${IP_SARA:?Set IP_SARA in .env}:8003
      VEHICULE_API_URL: http://${IP_LEILA:?Set IP_LEILA in .env}:8005
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RETOUR_CONTRAT_API_KEY: ${RETOUR_CONTRAT_API_KEY:-}
      RETOUR_VEHICULE_API_KEY: ${RETOUR_VEHICULE_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8006:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend_retour:
    build:
      context: ./frontend/Retour
      args:
        # Lien « Tableau de bord » de la barre latérale : frontend commun sur le PC de Leila
        VITE_ADMIN_URL: http://${IP_LEILA:?Set IP_LEILA in .env}:3000/admin
    depends_on:
      service_retour:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  mysql_data:
