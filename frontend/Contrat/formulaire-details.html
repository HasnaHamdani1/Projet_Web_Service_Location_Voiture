<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Détails et caution · Parc Auto</title>
  <link rel="stylesheet" href="contrats.css">
    <link rel="stylesheet" href="/admin/theme.css">
  <script src="/config.js"></script>
  <script src="/admin/menu.js" defer></script>
  <script type="module" src="formulaire-details.js"></script>
</head>
<body data-service="CONTRAT">
<aside class="rail">
  <div class="rail-brand">
    <span class="rail-brand-icon" aria-hidden="true">🚗</span>
    <div>
      <h2>PARC AUTO</h2>
      <span class="rail-status">Espace agence</span>
    </div>
  </div>
  <nav aria-label="Administration">
    <ul class="rail-menu">
      <li><a class="rail-link" href="../admin/dashboard.html" data-module="dashboard"><span aria-hidden="true">▦</span> Dashboard</a></li>
      <li><a class="rail-link" href="../admin/admin.html" data-module="vehicules"><span aria-hidden="true">🚗</span> Véhicules</a></li>
      <li><span class="rail-link" aria-disabled="true" data-module="reservations"><span aria-hidden="true">📅</span> Réservations</span></li>
      <li class="active"><a class="rail-link" href="index.html" aria-current="location" data-module="contrats"><span aria-hidden="true">📄</span> Contrats</a></li>
      <li><a class="rail-link" href="http://localhost:5173" data-module="retours"><span aria-hidden="true">⬅️</span> Retours</a></li>
    </ul>
  </nav>
</aside>
<main class="page">
  <header class="heading">
    <h1>Formulaire de détails du contrat</h1><span class="step">Étape 2 sur 3 · Détails et caution</span>
  </header>
  <form id="details" class="panel">
    <section class="section">
      <h2>Informations du contrat</h2>
      <div class="grid three">
        <label>Numéro de contrat <input id="numero" readonly></label>
        <label>Immatriculation <input id="immatriculation" readonly></label>
        <label>Client <input id="client" readonly></label>
        <label>Date de prise <input id="debut" readonly></label>
        <label>Date de fin <input id="fin" readonly></label>
        <label>Nombre de jours <input id="jours" readonly></label>
      </div>
      <div class="grid two">
        <label>Prix par jour <input id="prix" readonly></label>
        <label>Montant total <input class="total" id="total" readonly></label>
      </div>
    </section>
    <section class="section">
      <h2>Caution</h2>
      <div class="grid three">
        <label>Montant de la caution <input id="caution" type="number" min="0.01" max="99999999.99" step="0.01" required></label>
        <label>Mode d’encaissement
          <select id="mode" required>
            <option value="">Choisir un mode</option><option value="CARTE">Carte bancaire</option>
            <option value="ESPECES">Espèces</option><option value="CHEQUE">Chèque</option><option value="VIREMENT">Virement</option>
          </select>
        </label>
        <label>Statut de la caution
          <select id="statut-caution" required>
            <option value="">Choisir un statut</option><option value="RECUE">Reçue</option><option value="A_RECEVOIR">En attente</option>
          </select>
        </label>
      </div>
      <label>Conditions particulières <textarea id="conditions" rows="3" maxlength="1000"></textarea></label>
    </section>
    <footer class="actions"><a class="button" href="formulaire-identification.html">← Retour</a><button class="button primary">Suivant →</button></footer>
  </form>
</main>
</body>
</html>
