
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarRental | Connexion administrateur</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5f9;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .brand {
            text-align: center;
            color: #172554;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #172554;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #172554;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #243b75;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #error-message {
            color: #dc2626;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">CARRENTAL</div>

        <h1>Connexion administrateur</h1>

        <p class="description">
            Connectez-vous pour accéder à votre espace d'administration.
        </p>

        <form id="login-form">
            <label for="username">Identifiant</label>
            <input
                type="text"
                id="username"
                autocomplete="username"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="login-button">
                Se connecter
            </button>

            <p id="error-message" role="alert"></p>
        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
