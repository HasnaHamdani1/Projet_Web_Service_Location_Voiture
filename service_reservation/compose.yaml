# Service Réservation (Maryam) – lancement autonome, relié aux services des collègues par Tailscale.
#   cd service_reservation
#   copy .env.example .env      (puis remplir les adresses Tailscale et les secrets)
#   docker compose up --build -d
# Site client + espace agence : http://localhost:3002   API : http://localhost:8002/docs
# Pour tester seule avec une base locale : docker compose --profile base-locale up --build -d
name: reservation

services:
  service_reservation:
    build:
      context: ..
      dockerfile: service_reservation/Dockerfile
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
        required: false   # seulement avec --profile base-locale
    ports:
      - "8002:8000"      # joignable par les collègues : http://<IP-Tailscale-de-Maryam>:8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend_reservation:
    build:
      context: ./frontend
      args:
        VITE_ADMIN_DASHBOARD_URL: ${ADMIN_DASHBOARD_URL:-}
        VITE_MODULE_VEHICULES_URL: ${MODULE_VEHICULES_URL:-}
        VITE_MODULE_CONTRATS_URL: ${MODULE_CONTRATS_URL:-}
        VITE_MODULE_RETOURS_URL: ${MODULE_RETOURS_URL:-}
    environment:
      RESERVATION_API_UPSTREAM: http://service_reservation:8000
      AUTH_API_UPSTREAM: ${AUTH_API_URL:?Renseigner AUTH_API_URL dans .env (service Auth de Leila)}
      VEHICLE_API_UPSTREAM: ${VEHICLE_SERVICE_URL:?Renseigner VEHICLE_SERVICE_URL dans .env (service Véhicule de Leila)}
    depends_on:
      service_reservation:
        condition: service_healthy
    ports:
      - "3002:80"
    restart: unless-stopped

  # Base locale facultative (tests en solo) : dump officiel + migration 006.
  # Avec la base partagée de l'équipe, ce service ne démarre pas (profil désactivé).
  mysql:
    profiles: ["base-locale"]
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: db_location_voitures
      MYSQL_USER: location_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-location_app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql_reservation:/var/lib/mysql
      - "../Base_de_données/db_location_voitures.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro"
      - ./migrations/006_service_reservation.sql:/docker-entrypoint-initdb.d/006_service_reservation.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_reservation:
